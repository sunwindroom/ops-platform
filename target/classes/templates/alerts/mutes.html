<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>告警静默 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <h5 class="mb-3">告警静默 / 维护窗口</h5>
  <p class="text-muted">在计划性变更、维护期间，可设置静默窗口，期间该资产（或全部资产）产生的告警不会发送通知，避免误扰，但仍会记录告警本身。</p>

  <div class="card border-0 shadow-sm p-3 mb-3">
    <form th:action="@{/alerts/mutes/save}" method="post" class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label">适用资产</label>
        <select class="form-select" name="assetId">
          <option value="">全部资产</option>
          <option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name} + '（' + ${a.ip} + '）'"></option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">开始时间</label>
        <input type="datetime-local" class="form-control" name="startTime" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">结束时间</label>
        <input type="datetime-local" class="form-control" name="endTime" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">原因</label>
        <input class="form-control" name="reason" placeholder="如：版本升级">
      </div>
      <div class="col-md-1">
        <button type="submit" class="btn btn-dark w-100">新增</button>
      </div>
    </form>
  </div>

  <div class="card border-0 shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light"><tr><th>适用资产</th><th>开始时间</th><th>结束时间</th><th>原因</th><th>创建人</th><th>操作</th></tr></thead>
      <tbody>
        <tr th:each="m : ${mutes}">
          <td th:text="${m.assetName}">资产</td>
          <td th:text="${m.startTime}">开始</td>
          <td th:text="${m.endTime}">结束</td>
          <td th:text="${m.reason}">原因</td>
          <td th:text="${m.createdBy}">创建人</td>
          <td><button class="btn btn-sm btn-outline-danger" th:onclick="'delMute(' + ${m.id} + ')'">删除</button></td>
        </tr>
        <tr th:if="${mutes.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">暂无静默窗口</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
function delMute(id){
  if(!confirm('确认删除该静默窗口？')) return;
  fetch('/alerts/mutes/' + id + '/delete', {method:'POST'}).then(()=>location.reload());
}
</script>
</body>
</html>
