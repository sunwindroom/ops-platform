<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>资产管理 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="btn-group">
      <a class="btn btn-outline-secondary" th:classappend="${currentType == null} ? 'active'" href="/assets">全部</a>
      <a class="btn btn-outline-secondary" th:classappend="${currentType == 'PHYSICAL'} ? 'active'" href="/assets?type=PHYSICAL">物理服务器</a>
      <a class="btn btn-outline-secondary" th:classappend="${currentType == 'VIRTUAL'} ? 'active'" href="/assets?type=VIRTUAL">虚拟机</a>
      <a class="btn btn-outline-secondary" th:classappend="${currentType == 'ESXI'} ? 'active'" href="/assets?type=ESXI">虚拟化宿主</a>
      <a class="btn btn-outline-secondary" th:classappend="${currentType == 'NETWORK'} ? 'active'" href="/assets?type=NETWORK">网络设备</a>
      <a class="btn btn-outline-secondary" th:classappend="${currentType == 'PROBE'} ? 'active'" href="/assets?type=PROBE">探针监控</a>
    </div>
    <div>
      <a href="/discovery" class="btn btn-outline-primary">网络发现</a>
      <a href="/assets/import" class="btn btn-outline-primary">批量导入</a>
      <a href="/assets/new" class="btn btn-dark">+ 新增资产</a>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>名称</th><th>IP地址</th><th>类别</th><th>采集方式</th><th>状态</th><th>更新时间</th><th style="width:280px">操作</th></tr>
      </thead>
      <tbody>
        <tr th:each="a : ${assets}">
          <td><a th:href="@{'/monitor/' + ${a.id}}" th:text="${a.name}">名称</a></td>
          <td th:text="${a.ip}">IP</td>
          <td th:text="${a.category}">类别</td>
          <td th:text="${a.collectMethod}">方式</td>
          <td>
            <span class="badge bg-success" th:if="${a.status == 'ONLINE'}">在线</span>
            <span class="badge bg-danger" th:if="${a.status == 'OFFLINE'}">离线</span>
            <span class="badge bg-secondary" th:if="${a.status == 'UNKNOWN'}">未知</span>
          </td>
          <td class="text-muted small" th:text="${a.updateTime}">时间</td>
          <td>
            <a th:href="@{'/assets/' + ${a.id} + '/edit'}" class="btn btn-sm btn-outline-primary">编辑</a>
            <button class="btn btn-sm btn-outline-success" th:onclick="'collectNow(' + ${a.id} + ')'">立即采集</button>
            <button class="btn btn-sm btn-outline-danger" th:onclick="'delAsset(' + ${a.id} + ')'">删除</button>
          </td>
        </tr>
        <tr th:if="${assets.isEmpty()}"><td colspan="7" class="text-center text-muted py-4">暂无资产，点击右上角"新增资产"添加</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function delAsset(id) {
  if (!confirm('确认删除该资产吗？相关历史监控数据也将无法再关联查看。')) return;
  fetch('/assets/' + id + '/delete', {method:'POST'}).then(() => location.reload());
}
function collectNow(id) {
  fetch('/assets/' + id + '/collect-now', {method:'POST'}).then(r => r.json()).then(d => {
    alert('采集完成，当前状态：' + (d.status === 'ONLINE' ? '在线' : '离线'));
    location.reload();
  });
}
</script>
</body>
</html>
