<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>资产表单 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4" style="max-width:720px;">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white fw-bold" th:text="${asset.id == null} ? '新增资产' : '编辑资产'">资产表单</div>
    <div class="card-body">
      <form th:action="@{/assets/save}" th:object="${asset}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">资产名称 *</label>
            <input class="form-control" th:field="*{name}" required placeholder="如 web-server-01">
          </div>
          <div class="col-md-6">
            <label class="form-label">管理IP *</label>
            <input class="form-control" th:field="*{ip}" required placeholder="如 192.168.1.10">
          </div>

          <div class="col-md-6">
            <label class="form-label">资产大类 *</label>
            <select class="form-select" th:field="*{type}" required>
              <option value="PHYSICAL">物理服务器</option>
              <option value="VIRTUAL">虚拟机</option>
              <option value="ESXI">虚拟化宿主(ESXi)</option>
              <option value="NETWORK">网络设备</option>
              <option value="PROBE">探针监控(TCP/HTTP/Ping)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">细分类别 *</label>
            <select class="form-select" th:field="*{category}" required>
              <option value="physical_server">物理服务器(Linux)</option>
              <option value="physical_windows">物理服务器(Windows)</option>
              <option value="vm_linux">虚拟机-Linux</option>
              <option value="vm_windows">虚拟机-Windows</option>
              <option value="esxi_host">ESXi宿主机</option>
              <option value="switch">交换机</option>
              <option value="router">路由器</option>
              <option value="audit_gateway">上网行为审计</option>
              <option value="service_probe">业务/服务探针（配合"探针监控"类型使用）</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">采集方式</label>
            <select class="form-select" th:field="*{collectMethod}">
              <option value="SSH">SSH（Linux/Windows/ESXi）</option>
              <option value="SNMP">SNMP（网络设备）</option>
              <option value="PROBE">探针（TCP/HTTP/Ping）</option>
              <option value="NONE">不采集（仅登记资产）</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">厂商/型号</label>
            <input class="form-control" th:field="*{vendor}" placeholder="如 华为S5720 / Dell R740">
          </div>

          <div class="col-md-6">
            <label class="form-label">机房/位置</label>
            <input class="form-control" th:field="*{location}">
          </div>
          <div class="col-md-6">
            <label class="form-label">是否启用监控</label>
            <select class="form-select" th:field="*{monitorEnabled}">
              <option th:value="true">启用</option>
              <option th:value="false">停用</option>
            </select>
          </div>
        </div>

        <hr class="my-4">
        <h6 class="text-muted">SSH 参数（适用于 Linux / Windows(OpenSSH) / ESXi）</h6>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">SSH端口</label>
            <input type="number" class="form-control" th:field="*{sshPort}" placeholder="22">
          </div>
          <div class="col-md-4">
            <label class="form-label">SSH用户名</label>
            <input class="form-control" th:field="*{sshUser}">
          </div>
          <div class="col-md-5">
            <label class="form-label">SSH密码（留空则保持不变）</label>
            <input type="password" class="form-control" name="rawSshPassword" autocomplete="new-password">
          </div>
        </div>

        <hr class="my-4">
        <h6 class="text-muted">SNMP 参数（适用于交换机/路由器/审计设备）</h6>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">SNMP端口</label>
            <input type="number" class="form-control" th:field="*{snmpPort}" placeholder="161">
          </div>
          <div class="col-md-3">
            <label class="form-label">Community</label>
            <input class="form-control" th:field="*{snmpCommunity}" placeholder="public">
          </div>
          <div class="col-md-3">
            <label class="form-label">CPU私有OID（可选）</label>
            <input class="form-control" th:field="*{snmpOidCpu}">
          </div>
          <div class="col-md-3">
            <label class="form-label">内存私有OID（可选）</label>
            <input class="form-control" th:field="*{snmpOidMem}">
          </div>
          <div class="col-md-3">
            <label class="form-label">监控接口索引(ifIndex)</label>
            <input type="number" class="form-control" th:field="*{snmpIfIndex}" placeholder="1">
            <div class="form-text">默认1为主上行口，可通过 snmpwalk ifDescr 查询目标接口编号</div>
          </div>
        </div>

        <hr class="my-4">
        <h6 class="text-muted">探针监控参数（适用于"探针监控"类型资产，如网站/业务端口存活检测，无需账号密码）</h6>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label">探针类型</label>
            <select class="form-select" th:field="*{probeType}">
              <option value="TCP">TCP端口</option>
              <option value="HTTP">HTTP(S)</option>
              <option value="PING">Ping</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">端口（TCP探针必填）</label>
            <input type="number" class="form-control" th:field="*{probePort}" placeholder="如 80/443/3306">
          </div>
          <div class="col-md-4">
            <label class="form-label">URL（HTTP探针必填）</label>
            <input class="form-control" th:field="*{probeUrl}" placeholder="http://192.168.1.10/health">
          </div>
          <div class="col-md-2">
            <label class="form-label">超时(ms)</label>
            <input type="number" class="form-control" th:field="*{probeTimeoutMs}" placeholder="3000">
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label">备注</label>
          <textarea class="form-control" th:field="*{remark}" rows="2"></textarea>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-dark">保存</button>
          <a href="/assets" class="btn btn-outline-secondary">取消</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
