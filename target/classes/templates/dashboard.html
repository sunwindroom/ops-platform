<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>首页概览 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">

  <div class="row g-3 mb-4">
    <div class="col-md-3">
      <div class="card stat-card border-0 shadow-sm">
        <div class="card-body">
          <div class="text-muted small">资产总数</div>
          <div class="fs-2 fw-bold" th:text="${totalAssets}">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card border-0 shadow-sm">
        <div class="card-body">
          <div class="text-muted small">在线</div>
          <div class="fs-2 fw-bold text-success" th:text="${onlineCount}">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card border-0 shadow-sm">
        <div class="card-body">
          <div class="text-muted small">离线</div>
          <div class="fs-2 fw-bold text-danger" th:text="${offlineCount}">0</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card border-0 shadow-sm">
        <div class="card-body">
          <div class="text-muted small">未处理告警</div>
          <div class="fs-2 fw-bold text-warning" th:text="${openAlertCount}">0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold">CPU使用率 Top5</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="m : ${topCpu}">
            <span th:text="${m.name} + '（' + ${m.ip} + '）'">资产</span>
            <span class="badge bg-primary" th:text="${m.value} + '%'">0%</span>
          </li>
          <li class="list-group-item text-muted" th:if="${topCpu.isEmpty()}">暂无数据</li>
        </ul>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold">内存使用率 Top5</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center" th:each="m : ${topMem}">
            <span th:text="${m.name} + '（' + ${m.ip} + '）'">资产</span>
            <span class="badge bg-success" th:text="${m.value} + '%'">0%</span>
          </li>
          <li class="list-group-item text-muted" th:if="${topMem.isEmpty()}">暂无数据</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold">资产分布</div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between" th:each="entry : ${typeCount}">
            <span th:text="${entry.key}">TYPE</span>
            <span class="badge bg-secondary" th:text="${entry.value}">0</span>
          </li>
          <li class="list-group-item text-muted" th:if="${typeCount.isEmpty()}">暂无资产，请先前往「资产管理」添加</li>
        </ul>
      </div>
    </div>
    <div class="col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold d-flex justify-content-between">
          <span>最近告警</span>
          <a href="/alerts/records" class="small">查看全部 →</a>
        </div>
        <table class="table table-sm mb-0">
          <thead><tr><th>级别</th><th>资产</th><th>指标</th><th>触发值</th><th>状态</th><th>时间</th></tr></thead>
          <tbody>
            <tr th:each="r : ${recentAlerts}">
              <td><span th:class="'badge level-' + ${r.level}" th:text="${r.level}">级别</span></td>
              <td th:text="${r.assetName}">资产</td>
              <td th:text="${r.metricType}">指标</td>
              <td th:text="${r.triggerValue}">值</td>
              <td th:text="${r.status}">状态</td>
              <td class="text-muted small" th:text="${r.createTime}">时间</td>
            </tr>
            <tr th:if="${recentAlerts.isEmpty()}"><td colspan="6" class="text-muted text-center py-3">暂无告警记录</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
