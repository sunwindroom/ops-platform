<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${asset.name} + ' - 监控详情'">监控详情</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <h4 th:text="${asset.name} + '（' + ${asset.ip} + '）'">资产名称</h4>
  <p class="text-muted" th:text="'类别: ' + ${asset.category} + ' ｜ 状态: ' + ${asset.status}">信息</p>

  <div class="row g-3 mb-3" id="latestCards"></div>

  <div class="row g-3">
    <div class="col-md-6"><div class="card p-3 border-0 shadow-sm"><canvas id="chartCpu" height="180"></canvas></div></div>
    <div class="col-md-6"><div class="card p-3 border-0 shadow-sm"><canvas id="chartMem" height="180"></canvas></div></div>
    <div class="col-md-6"><div class="card p-3 border-0 shadow-sm"><canvas id="chartDisk" height="180"></canvas></div></div>
    <div class="col-md-6"><div class="card p-3 border-0 shadow-sm"><canvas id="chartNet" height="180"></canvas></div></div>
  </div>
</div>

<script th:inline="javascript">
const assetId = /*[[${asset.id}]]*/ 0;

function loadLatest() {
  fetch('/api/metrics/' + assetId + '/latest').then(r => r.json()).then(d => {
    const cards = [
      {label:'CPU使用率', key:'cpu_usage', unit:'%'},
      {label:'内存使用率', key:'mem_usage', unit:'%'},
      {label:'磁盘使用率', key:'disk_usage', unit:'%'},
      {label:'下行流量', key:'net_in_kbps', unit:'kbps'},
      {label:'上行流量', key:'net_out_kbps', unit:'kbps'},
      {label:'1分钟负载', key:'load1', unit:''},
      {label:'响应耗时', key:'response_ms', unit:'ms'},
      {label:'HTTP状态码', key:'http_status', unit:''},
    ];
    let html = '';
    cards.forEach(c => {
      if (d[c.key] === undefined) return;
      html += `<div class="col-md-2"><div class="card border-0 shadow-sm p-3 text-center">
        <div class="text-muted small">${c.label}</div>
        <div class="fs-4 fw-bold">${d[c.key]}${c.unit}</div></div></div>`;
    });
    document.getElementById('latestCards').innerHTML = html || '<div class="text-muted px-3">暂无数据，请等待下一次采集周期，或前往资产管理页点击"立即采集"</div>';
  });
}

function drawChart(canvasId, metricType, label, color) {
  fetch('/api/metrics/' + assetId + '?metricType=' + metricType + '&hours=6').then(r => r.json()).then(d => {
    new Chart(document.getElementById(canvasId), {
      type: 'line',
      data: {
        labels: d.labels.map(t => t.substring(11,16)),
        datasets: [{ label: label, data: d.values, borderColor: color, tension:0.3, pointRadius:0 }]
      },
      options: { responsive:true, plugins:{title:{display:true,text:label}} }
    });
  });
}

loadLatest();
drawChart('chartCpu', 'cpu_usage', 'CPU使用率(%)', '#2563eb');
drawChart('chartMem', 'mem_usage', '内存使用率(%)', '#16a34a');
drawChart('chartDisk', 'disk_usage', '磁盘使用率(%)', '#d97706');
drawChart('chartNet', 'net_in_kbps', '下行流量(kbps)', '#7c3aed');
</script>
</body>
</html>
