<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>审计日志</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <h5 class="mb-3">操作审计日志（最近200条）</h5>
  <div class="card border-0 shadow-sm">
    <table class="table table-sm mb-0 align-middle">
      <thead class="table-light"><tr><th>时间</th><th>操作人</th><th>操作类型</th><th>对象</th><th>详情</th></tr></thead>
      <tbody>
        <tr th:each="l : ${logs}">
          <td class="text-muted small" th:text="${l.createTime}">时间</td>
          <td th:text="${l.username}">操作人</td>
          <td><span class="badge bg-secondary" th:text="${l.action}">类型</span></td>
          <td th:text="${l.targetType} + (${l.targetId} != null ? ('#' + ${l.targetId}) : '')">对象</td>
          <td class="text-muted small" th:text="${l.detail}">详情</td>
        </tr>
        <tr th:if="${logs.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">暂无审计记录</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
