<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户管理</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <div class="d-flex justify-content-between mb-3">
    <h5 class="mb-0">用户管理</h5>
    <a href="/users/new" class="btn btn-dark">+ 新增用户</a>
  </div>
  <div class="card border-0 shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light"><tr><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        <tr th:each="u : ${users}">
          <td th:text="${u.username}">用户名</td>
          <td><span class="badge bg-secondary" th:text="${u.role}">角色</span></td>
          <td>
            <span class="badge bg-success" th:if="${u.enabled}">启用</span>
            <span class="badge bg-danger" th:unless="${u.enabled}">停用</span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-danger" th:if="${u.username != 'admin'}" th:onclick="'delUser(' + ${u.id} + ')'">删除</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="text-muted small mt-2">说明：ADMIN 拥有全部权限；OPERATOR 可管理资产/告警规则/自动化任务但不能删除或管理用户；VIEWER 仅可查看。</p>
</div>
<script>
function delUser(id){
  if(!confirm('确认删除该用户？')) return;
  fetch('/users/' + id + '/delete', {method:'POST'}).then(()=>location.reload());
}
</script>
</body>
</html>
