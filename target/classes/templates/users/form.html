<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>新增用户</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4" style="max-width:480px;">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white fw-bold">新增用户</div>
    <div class="card-body">
      <form th:action="@{/users/save}" th:object="${user}" method="post">
        <div class="mb-3">
          <label class="form-label">用户名 *</label>
          <input class="form-control" th:field="*{username}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">初始密码（留空则默认 Ops@123456，建议登录后自行修改）</label>
          <input type="password" class="form-control" name="rawPassword">
        </div>
        <div class="mb-3">
          <label class="form-label">角色</label>
          <select class="form-select" th:field="*{role}">
            <option value="ADMIN">ADMIN 管理员（全部权限）</option>
            <option value="OPERATOR">OPERATOR 操作员（可操作资产/告警/任务，不可管理用户）</option>
            <option value="VIEWER">VIEWER 只读</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">状态</label>
          <select class="form-select" th:field="*{enabled}">
            <option th:value="true">启用</option>
            <option th:value="false">停用</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-dark">保存</button>
          <a href="/users" class="btn btn-outline-secondary">取消</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
