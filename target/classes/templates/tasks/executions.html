<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>任务执行记录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <h5 th:text="'执行记录：' + ${task.name}">执行记录</h5>
  <div class="card border-0 shadow-sm mt-3">
    <table class="table mb-0 align-middle">
      <thead class="table-light"><tr><th>资产</th><th>状态</th><th>退出码</th><th>开始时间</th><th>结束时间</th><th>输出</th></tr></thead>
      <tbody>
        <tr th:each="e : ${executions}">
          <td th:text="${e.assetName}">资产</td>
          <td>
            <span class="badge bg-warning" th:if="${e.status=='RUNNING'}">执行中</span>
            <span class="badge bg-success" th:if="${e.status=='SUCCESS'}">成功</span>
            <span class="badge bg-danger" th:if="${e.status=='FAILED'}">失败</span>
          </td>
          <td th:text="${e.exitCode}">码</td>
          <td class="text-muted small" th:text="${e.startTime}">开始</td>
          <td class="text-muted small" th:text="${e.endTime}">结束</td>
          <td><pre class="mb-0 small" style="max-width:400px;white-space:pre-wrap;" th:text="${e.output}"></pre></td>
        </tr>
        <tr th:if="${executions.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">暂无执行记录</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
