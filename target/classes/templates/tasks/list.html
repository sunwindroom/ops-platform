<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>自动化运维 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <div class="d-flex justify-content-between mb-3">
    <h5 class="mb-0">自动化运维任务</h5>
    <a href="/tasks/new" class="btn btn-dark">+ 新增任务</a>
  </div>
  <div class="card border-0 shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>任务名称</th><th>脚本类型</th><th>目标资产数</th><th>定时表达式</th><th>状态</th><th style="width:320px">操作</th></tr>
      </thead>
      <tbody>
        <tr th:each="t : ${tasks}">
          <td th:text="${t.name}">名称</td>
          <td th:text="${t.scriptType}">类型</td>
          <td th:text="${t.targetAssetIds != null ? #strings.arraySplit(t.targetAssetIds,',').length : 0}">数量</td>
          <td th:text="${t.cronExpression} ?: '仅手动'">cron</td>
          <td>
            <span class="badge bg-success" th:if="${t.enabled}">启用</span>
            <span class="badge bg-secondary" th:unless="${t.enabled}">停用</span>
          </td>
          <td>
            <button class="btn btn-sm btn-outline-success" th:onclick="'runTask(' + ${t.id} + ')'">立即执行</button>
            <a th:href="@{'/tasks/' + ${t.id} + '/edit'}" class="btn btn-sm btn-outline-primary">编辑</a>
            <a th:href="@{'/tasks/' + ${t.id} + '/executions'}" class="btn btn-sm btn-outline-secondary">执行记录</a>
            <button class="btn btn-sm btn-outline-danger" th:onclick="'delTask(' + ${t.id} + ')'">删除</button>
          </td>
        </tr>
        <tr th:if="${tasks.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">暂无任务，可创建如"磁盘清理巡检""服务重启脚本"等</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
function runTask(id){
  if(!confirm('确认立即在目标资产上执行该任务？')) return;
  fetch('/tasks/' + id + '/run', {method:'POST'}).then(r=>r.json()).then(d=>alert(d.message));
}
function delTask(id){
  if(!confirm('确认删除该任务？')) return;
  fetch('/tasks/' + id + '/delete', {method:'POST'}).then(()=>location.reload());
}
</script>
</body>
</html>
