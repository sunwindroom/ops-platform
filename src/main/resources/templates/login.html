<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>登录 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#1f2937,#374151); height:100vh; display:flex; align-items:center; justify-content:center;}
    .login-card { width:380px; border-radius:12px; }
  </style>
</head>
<body>
<div class="card login-card shadow p-4">
  <h4 class="text-center mb-3">🖥 内网自动运维平台</h4>
  <p class="text-center text-muted small mb-4">资产管理 · 监控采集 · 阈值告警 · 自动化运维</p>
  <div th:if="${param.error}" class="alert alert-danger py-2">用户名或密码错误</div>
  <div th:if="${param.logout}" class="alert alert-success py-2">已安全退出</div>
  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label class="form-label">用户名</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">密码</label>
      <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">登 录</button>
  </form>
  <p class="text-center text-muted small mt-3">默认账号 admin / Admin@123，首次登录请及时修改</p>
</div>
</body>
</html>
