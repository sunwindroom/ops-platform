<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>网络自动发现</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <h5 class="mb-3">网络自动发现</h5>
  <p class="text-muted">输入网段（CIDR，如 <code>192.168.1.0/24</code>），扫描存活主机并尝试通过SNMP识别网络设备。
    扫描结果可勾选后批量导入为资产（默认停用监控，需补充采集账号后手动启用）。单次扫描上限512个IP，/24网段耗时约1-2分钟。</p>

  <div class="card border-0 shadow-sm p-3 mb-3">
    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <label class="form-label">网段 (CIDR)</label>
        <input class="form-control" id="cidr" placeholder="192.168.1.0/24">
      </div>
      <div class="col-md-3">
        <label class="form-label">SNMP Community</label>
        <input class="form-control" id="community" value="public">
      </div>
      <div class="col-md-2">
        <button class="btn btn-dark w-100" onclick="startScan()">开始扫描</button>
      </div>
    </div>
  </div>

  <div id="scanStatus" class="text-muted mb-2"></div>

  <div class="card border-0 shadow-sm" id="resultCard" style="display:none;">
    <div class="card-header bg-white d-flex justify-content-between">
      <span>发现结果</span>
      <button class="btn btn-sm btn-success" onclick="importSelected()">批量导入勾选项</button>
    </div>
    <table class="table table-sm mb-0 align-middle">
      <thead class="table-light">
        <tr><th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th><th>IP</th><th>SNMP</th><th>设备描述</th><th>推测类别</th></tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</div>

<script>
let currentResults = [];

function startScan() {
  const cidr = document.getElementById('cidr').value.trim();
  if (!cidr) { alert('请输入网段，如 192.168.1.0/24'); return; }
  const community = document.getElementById('community').value.trim() || 'public';
  document.getElementById('scanStatus').innerText = '扫描中，请稍候...（视网段大小可能需要1-2分钟）';
  document.getElementById('resultCard').style.display = 'none';

  const params = new URLSearchParams({cidr, community});
  fetch('/discovery/scan', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: params})
    .then(r => r.json())
    .then(data => {
      currentResults = data;
      renderResults(data);
      document.getElementById('scanStatus').innerText = '扫描完成，共发现 ' + data.length + ' 台存活主机';
      document.getElementById('resultCard').style.display = data.length ? '' : 'none';
    })
    .catch(() => document.getElementById('scanStatus').innerText = '扫描失败，请检查网段格式');
}

function renderResults(list) {
  const categoryOptions = ['physical_server','physical_windows','vm_linux','vm_windows','esxi_host','switch','router','audit_gateway'];
  let html = '';
  list.forEach((r, idx) => {
    const options = categoryOptions.map(c => `<option value="${c}" ${c===r.suggestCategory?'selected':''}>${c}</option>`).join('');
    html += `<tr>
      <td><input type="checkbox" class="rowCheck" data-idx="${idx}"></td>
      <td>${r.ip}</td>
      <td>${r.snmpSupported ? '<span class="badge bg-success">支持</span>' : '<span class="badge bg-secondary">不支持</span>'}</td>
      <td class="text-muted small">${r.sysDescr || '-'}</td>
      <td><select class="form-select form-select-sm" id="cat_${idx}">${options}</select></td>
    </tr>`;
  });
  document.getElementById('resultBody').innerHTML = html;
}

function toggleAll(el) {
  document.querySelectorAll('.rowCheck').forEach(c => c.checked = el.checked);
}

function importSelected() {
  const checks = document.querySelectorAll('.rowCheck:checked');
  if (checks.length === 0) { alert('请先勾选要导入的设备'); return; }
  const items = Array.from(checks).map(c => {
    const idx = c.dataset.idx;
    const r = currentResults[idx];
    const category = document.getElementById('cat_' + idx).value;
    return {ip: r.ip, name: r.ip, category: category};
  });
  fetch('/discovery/import', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(items)})
    .then(r => r.json())
    .then(d => {
      alert('已导入 ' + d.imported + ' 个资产，请前往「资产管理」补充采集账号信息后手动启用监控');
      window.location.href = '/assets';
    });
}
</script>
</body>
</html>
