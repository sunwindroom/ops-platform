<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>告警规则 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <div class="d-flex justify-content-between mb-3">
    <h5 class="mb-0">告警规则</h5>
    <a href="/alerts/rules/new" class="btn btn-dark">+ 新增规则</a>
  </div>
  <div class="card border-0 shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>名称</th><th>适用资产</th><th>指标</th><th>条件</th><th>连续次数</th><th>级别</th><th>状态</th><th>操作</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${rules}">
          <td th:text="${r.name}">名称</td>
          <td th:text="${r.assetId != null} ? ('单个资产#' + ${r.assetId}) : ${r.assetType}">适用</td>
          <td th:text="${r.metricType}">指标</td>
          <td th:text="${r.operator} + ' ' + ${r.threshold}">条件</td>
          <td th:text="${r.consecutiveTimes}">次数</td>
          <td><span th:class="'badge level-' + ${r.level}" th:text="${r.level}">级别</span></td>
          <td>
            <span class="badge bg-success" th:if="${r.enabled}">启用</span>
            <span class="badge bg-secondary" th:unless="${r.enabled}">停用</span>
          </td>
          <td>
            <a th:href="@{'/alerts/rules/' + ${r.id} + '/edit'}" class="btn btn-sm btn-outline-primary">编辑</a>
            <button class="btn btn-sm btn-outline-danger" th:onclick="'delRule(' + ${r.id} + ')'">删除</button>
          </td>
        </tr>
        <tr th:if="${rules.isEmpty()}"><td colspan="8" class="text-center text-muted py-4">暂无规则，点击右上角新增（如：CPU使用率&gt;=90% 连续3次 触发critical告警）</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
function delRule(id){
  if(!confirm('确认删除该规则？')) return;
  fetch('/alerts/rules/' + id + '/delete', {method:'POST'}).then(()=>location.reload());
}
</script>
</body>
</html>
