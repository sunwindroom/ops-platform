<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>告警记录 - 内网自动运维平台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container-fluid mt-4 px-4">
  <div class="d-flex justify-content-between mb-3">
    <div class="btn-group">
      <a class="btn btn-outline-secondary" th:classappend="${currentStatus=='OPEN'}?'active'" href="/alerts/records?status=OPEN">未恢复</a>
      <a class="btn btn-outline-secondary" th:classappend="${currentStatus=='RESOLVED'}?'active'" href="/alerts/records?status=RESOLVED">已恢复</a>
      <a class="btn btn-outline-secondary" th:classappend="${currentStatus=='ALL'}?'active'" href="/alerts/records?status=ALL">全部(最近50条)</a>
    </div>
  </div>
  <div class="card border-0 shadow-sm">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr><th>级别</th><th>资产</th><th>指标</th><th>触发值</th><th>阈值</th><th>状态</th><th>已确认</th><th>触发时间</th><th>恢复时间</th><th>操作</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${records}">
          <td><span th:class="'badge level-' + ${r.level}" th:text="${r.level}">级别</span></td>
          <td th:text="${r.assetName}">资产</td>
          <td th:text="${r.metricType}">指标</td>
          <td th:text="${r.triggerValue}">值</td>
          <td th:text="${r.threshold}">阈值</td>
          <td>
            <span class="badge bg-danger" th:if="${r.status=='OPEN'}">告警中</span>
            <span class="badge bg-success" th:if="${r.status=='RESOLVED'}">已恢复</span>
          </td>
          <td>
            <span th:if="${r.acked}">✔</span>
            <span th:unless="${r.acked}">-</span>
          </td>
          <td class="text-muted small" th:text="${r.createTime}">时间</td>
          <td class="text-muted small" th:text="${r.resolveTime}">恢复时间</td>
          <td>
            <button th:if="${r.status=='OPEN' and !r.acked}" class="btn btn-sm btn-outline-secondary" th:onclick="'ack(' + ${r.id} + ')'">确认</button>
          </td>
        </tr>
        <tr th:if="${records.isEmpty()}"><td colspan="10" class="text-center text-muted py-4">暂无记录</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
function ack(id){
  fetch('/alerts/records/' + id + '/ack', {method:'POST'}).then(()=>location.reload());
}
</script>
</body>
</html>
