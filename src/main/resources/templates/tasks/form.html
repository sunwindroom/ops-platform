<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>自动化任务表单</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4" style="max-width:760px;">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white fw-bold">自动化运维任务</div>
    <div class="card-body">
      <form th:action="@{/tasks/save}" th:object="${task}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
          <label class="form-label">任务名称 *</label>
          <input class="form-control" th:field="*{name}" required placeholder="如：清理/tmp目录巡检">
        </div>

        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">脚本类型</label>
            <select class="form-select" th:field="*{scriptType}">
              <option value="shell">Shell（Linux/ESXi）</option>
              <option value="powershell">PowerShell（Windows）</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">定时表达式（可选，Cron，留空则仅手动执行）</label>
            <input class="form-control" th:field="*{cronExpression}" placeholder="如 0 0 2 * * ? 表示每天2点">
          </div>
          <div class="col-md-4">
            <label class="form-label">是否启用</label>
            <select class="form-select" th:field="*{enabled}">
              <option th:value="true">启用</option>
              <option th:value="false">停用</option>
            </select>
          </div>
        </div>

        <div class="mt-3">
          <label class="form-label">脚本内容 *</label>
          <textarea class="form-control" th:field="*{scriptContent}" rows="8" required
            placeholder="例如：df -h && free -m  （每台目标资产将各自独立执行该脚本）"></textarea>
        </div>

        <div class="mt-3">
          <label class="form-label">目标资产（可多选） *</label>
          <select class="form-select" multiple size="8" id="targetSelect">
            <option th:each="a : ${assets}" th:value="${a.id}" th:text="${a.name} + '（' + ${a.ip} + '）'"></option>
          </select>
          <input type="hidden" th:field="*{targetAssetIds}" id="targetAssetIdsInput">
          <div class="form-text">按住 Ctrl / Cmd 可多选</div>
        </div>

        <div class="mt-3">
          <label class="form-label">备注</label>
          <input class="form-control" th:field="*{remark}">
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-dark">保存</button>
          <a href="/tasks" class="btn btn-outline-secondary">取消</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script th:inline="javascript">
// 回显已选中的目标资产，并在提交前把多选结果拼接为逗号分隔字符串写入隐藏字段
const existing = /*[[${task.targetAssetIds}]]*/ '';
const select = document.getElementById('targetSelect');
if (existing) {
  const ids = existing.split(',').map(s => s.trim());
  for (const opt of select.options) {
    if (ids.includes(opt.value)) opt.selected = true;
  }
}
document.querySelector('form').addEventListener('submit', function() {
  const selected = Array.from(select.selectedOptions).map(o => o.value);
  document.getElementById('targetAssetIdsInput').value = selected.join(',');
});
</script>
</body>
</html>
