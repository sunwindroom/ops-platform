<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>个人中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container mt-4" style="max-width:480px;">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-white fw-bold">个人中心</div>
    <div class="card-body">
      <p>当前账号：<strong th:text="${user.username}">用户名</strong>　角色：<span class="badge bg-secondary" th:text="${user.role}">角色</span></p>

      <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
      <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>

      <form th:action="@{/profile/change-password}" method="post">
        <div class="mb-3">
          <label class="form-label">原密码</label>
          <input type="password" class="form-control" name="oldPassword" required>
        </div>
        <div class="mb-3">
          <label class="form-label">新密码（至少6位）</label>
          <input type="password" class="form-control" name="newPassword" required>
        </div>
        <div class="mb-3">
          <label class="form-label">确认新密码</label>
          <input type="password" class="form-control" name="confirmPassword" required>
        </div>
        <button type="submit" class="btn btn-dark">修改密码</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
